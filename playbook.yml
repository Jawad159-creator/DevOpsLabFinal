- name: Configure Target EC2 Instance
  hosts: all
  become: true
  tasks:
    - name: Update apt repository cache
      apt:
        update_cache: yes

    - name: Install prerequisite packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

- name: Automate Docker Installation on AWS EC2
  hosts: webservers
  become: true
  tasks:
    - name: Update apt index cache
      apt:
        update_cache: yes

    - name: Install prerequisite system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - git
        state: present

    - name: Add Docker formal GPG apt key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Append Docker repository to sources
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        state: present

    - name: Execute Docker Engine installation
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Confirm Docker daemon service is active
      service:
        name: docker
        state: started
        enabled: yes

    - name: Map 'ubuntu' system user to docker privileges group
      user:
        name: ubuntu
        groups: docker
        append: yes